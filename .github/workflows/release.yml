name: "Release"

on:
  workflow_dispatch:
  push:
    tags: ["v*-*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bind release to the accepted Windows candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify-release.py source
          pin=.github/verified-windows.json
          run=$(jq -er .run_id "$pin")
          commit=$(jq -er .commit "$pin")
          attempt=$(jq -er .attempt "$pin")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/attempts/$attempt" |
            jq -e --arg commit "$commit" --arg branch "candidate/windows/$GITHUB_REF_NAME" '
              .status == "completed" and .conclusion == "success" and .event == "push" and
              .head_sha == $commit and .head_branch == $branch and
              .path == ".github/workflows/personal-windows.yml"'
          gh run download "$run" -n "verified-windows-$commit-$attempt" -D "$RUNNER_TEMP/tested"
          python3 scripts/verify-release.py candidate "$RUNNER_TEMP/tested"

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const version = '${{ steps.get-version.outputs.version }}';
            const notes = fs.readFileSync(`RELEASE-NOTES-v${version}.md`, 'utf8');
            // Put installer links first on every release page.
            const guide = fs.readFileSync('.github/release-download-guide.md', 'utf8')
              .replaceAll('{{VERSION}}', version);
            const body = `${guide.trimEnd()}\n\n---\n\n${notes.trim()}\n`;
            // A failed build leaves its draft behind. Resume it without moving the tag.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const existing = releases.find(release => release.tag_name === `v${version}`);
            if (existing) {
              if (!existing.draft) throw new Error(`Release v${version} is already published`);
              if (existing.body !== body) throw new Error('Existing draft has different release notes');
              return existing.id;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              target_commitish: context.sha,
              name: `klava-nevinovata v${version}`,
              body,
              draft: true,
              prerelease: false,
              generate_release_notes: false
            })
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26" # ARM macs (Apple Silicon) — experimental, untested by maintainer
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # Intel macs — experimental, untested by maintainer
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # .deb
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04" # AppImage + RPM
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }} -- --locked
      sign-binaries: false
      asset-prefix: "klava-nevinovata"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      # A manual CI repair must build the same tagged application source.
      ref: ${{ github.sha }}
      # Releases always build from scratch — never restore the Rust cache, so a
      # stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets: inherit

  publish-release:
    permissions:
      actions: read
      contents: write
    needs: [create-release, publish-tauri]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Prepare locked Tauri signer and updater verifier
        run: |
          bun install --frozen-lockfile --ignore-scripts
          sudo apt-get update -qq
          sudo apt-get install -y minisign
      - name: Retrieve draft and exact tested NSIS
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ID: ${{ needs.create-release.outputs.release-id }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$EXPECTED_ID" --jq '.draft')" = true
          pin=.github/verified-windows.json
          gh run download "$(jq -er .run_id "$pin")" -n "verified-windows-$(jq -er .commit "$pin")-$(jq -er .attempt "$pin")" -D "$RUNNER_TEMP/tested"
          python3 scripts/verify-release.py candidate "$RUNNER_TEMP/tested"
          bundle="$RUNNER_TEMP/bundle"
          mkdir "$bundle"
          gh release download "$GITHUB_REF_NAME" -D "$bundle"
          name=$(jq -er .file "$RUNNER_TEMP/tested/verification.json")
          cp "$RUNNER_TEMP/tested/$name" "$bundle/$name"
          mv "$bundle/$name.sig" "$RUNNER_TEMP/rebuilt.sig"
      - name: Sign the accepted bytes for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          name=$(jq -er .file "$RUNNER_TEMP/tested/verification.json")
          bun run tauri signer sign "$RUNNER_TEMP/bundle/$name" >/dev/null
      - name: Verify all updater routes and signed packages, then replace three draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ID: ${{ needs.create-release.outputs.release-id }}
        run: |
          bundle="$RUNNER_TEMP/bundle"
          name=$(jq -er .file "$RUNNER_TEMP/tested/verification.json")
          python3 scripts/verify-release.py replace-signature "$bundle"
          python3 scripts/verify-release.py bundle "$bundle"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$EXPECTED_ID" --jq '.draft')" = true
          gh release upload "$GITHUB_REF_NAME" "$bundle/$name" "$bundle/$name.sig" "$bundle/latest.json" --clobber
          gh release view "$GITHUB_REF_NAME" --json isDraft,tagName,assets > "$RUNNER_TEMP/uploaded.json"
          python3 scripts/verify-release.py uploaded "$bundle" --release "$RUNNER_TEMP/uploaded.json"
      - name: Flip draft to false
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ID: ${{ needs.create-release.outputs.release-id }}
        run: |
          test "$(git ls-remote --refs origin "$GITHUB_REF" | cut -f1)" = "$(git rev-parse HEAD)"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$EXPECTED_ID" -F draft=false --silent
